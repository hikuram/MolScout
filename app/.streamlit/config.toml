[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6FBFB"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#D7E3E6"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 13
baseFontWeight = 400
headingFontSizes = ["34px", "28px", "23px", "19px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#0F766E", "#2563EB", "#F59E0B", "#DC2626", "#7C3AED", "#14B8A6", "#64748B", "#EA580C"]

[theme.sidebar]
backgroundColor = "#EEF7F7"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#D7E3E6"

[server]
#enableCORS = false
#sslCertFile = '/etc/certificate/web-server.crt'
#sslKeyFile = '/etc/certificate/web-server.key'

[browser]
gatherUsageStats = false
