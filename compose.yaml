services:
  postgres:
    image: postgres:17-alpine
    container_name: molscout_postgres
    restart: always
    environment:
      TZ: Asia/Tokyo
      POSTGRES_DB: ${POSTGRES_DB:-molscout}
      POSTGRES_USER: ${POSTGRES_USER:-molscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-molscout}
    volumes:
      - molscout_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-molscout} -d ${POSTGRES_DB:-molscout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  molscout:
    build:
      dockerfile: Dockerfile
      args:
        - CACHE_BUST=${CACHE_BUST:-1}
    container_name: molscout_app
    init: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Tokyo
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-molscout}
      PGUSER: ${POSTGRES_USER:-molscout}
      PGPASSWORD: ${POSTGRES_PASSWORD:-molscout}
    ports:
      - "8501:8501"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data:/opt/MolScout/data
      #- ./app/.streamlit/:/opt/MolScout/app/.streamlit
      #- /etc/certificate:/etc/certificate
    command: ["streamlit", "run", "/opt/MolScout/app/streamlit_app.py"]

volumes:
  molscout_postgres:
